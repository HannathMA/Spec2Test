services:
  - type: web
    name: spec2test-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: PROJECT_NAME
        value: Spec2Test AI
      - key: AI_PROVIDER
        value: local
      - key: DEMO_TARGET_URL
        value: /demo-target
      - key: ALLOWED_ORIGINS
        value: https://spec2-test.vercel.app
